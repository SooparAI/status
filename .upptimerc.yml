# .upptimerc.yml — GoFundNode status configuration
owner: SooparAI
repo: status

sites:
  - name: API
    url: https://api.gofundnode.com/health
  - name: API readiness
    url: https://api.gofundnode.com/ready
  - name: Website
    url: https://gofundnode.com
  - name: Docs
    url: https://docs.gofundnode.com
  - name: Console
    url: https://console.gofundnode.com
  - name: Staging API
    url: https://api.staging.gofundnode.com/health
    expectedStatusCodes:
      - 200
      - 502

status-website:
  cname: status.gofundnode.com
  name: GoFundNode Status
  introTitle: "GoFundNode service status"
  introMessage: Live uptime and incident history for the GoFundNode platform, published automatically every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: gofundnode.com
      href: https://gofundnode.com
    - title: Docs
      href: https://docs.gofundnode.com

assignees:
  - sooryarp

# Raised via repository issues automatically on downtime.
commitMessages:
  commitAuthorName: upptime-bot
  commitAuthorEmail: ops@gofundnode.com
